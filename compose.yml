services:
  api:
    build: ./backend
    container_name: market-atlas-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - market-atlas-cache:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  market-atlas-cache:
